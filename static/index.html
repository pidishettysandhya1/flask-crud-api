
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px #ddd;
        }

        input {
            padding: 12px;
            margin: 8px 5px 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            background: #2563eb;
        }

        button:hover {
            opacity: 0.85;
        }

        .delete-btn {
            background: #dc2626;
        }

        .edit-btn {
            background: #16a34a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px #ddd;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Product Management Dashboard</h1>

    <div class="form-box">
        <h2>Add Product</h2>

        <form id="productForm">
            <input type="text" id="name" placeholder="Product Name" required>

            <input type="number" id="price" placeholder="Price" required>

            <button type="submit">Add Product</button>
        </form>

        <p class="message" id="message"></p>
    </div>

    <h2>Products List</h2>

    <br>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="productTable">
        </tbody>
    </table>

</div>

<script>

const API_URL = "/products";

const form = document.getElementById("productForm");
const productTable = document.getElementById("productTable");
const message = document.getElementById("message");

// Get all products
async function loadProducts() {

    const response = await fetch(API_URL);
    const products = await response.json();

    productTable.innerHTML = "";

    products.forEach(product => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${product.id}</td>
            <td>${product.name}</td>
            <td>₹${product.price}</td>
            <td>
                <button class="edit-btn"
                    onclick="editProduct(${product.id}, '${product.name}', ${product.price})">
                    Edit
                </button>

                <button class="delete-btn"
                    onclick="deleteProduct(${product.id})">
                    Delete
                </button>
            </td>
        `;

        productTable.appendChild(row);
    });
}

// Add product
form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const price = document.getElementById("price").value;

    const response = await fetch(API_URL, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            name: name,
            price: Number(price)
        })

    });

    const result = await response.json();

    message.textContent = result.message;

    form.reset();

    loadProducts();

});

// Edit product
async function editProduct(id, oldName, oldPrice) {

    const name = prompt("Enter new product name:", oldName);

    if (name === null) return;

    const price = prompt("Enter new product price:", oldPrice);

    if (price === null) return;

    const response = await fetch(`${API_URL}/${id}`, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            name: name,
            price: Number(price)
        })

    });

    const result = await response.json();

    message.textContent = result.message;

    loadProducts();

}

// Delete product
async function deleteProduct(id) {

    const confirmDelete = confirm("Are you sure you want to delete this product?");

    if (!confirmDelete) return;

    const response = await fetch(`${API_URL}/${id}`, {

        method: "DELETE"

    });

    const result = await response.json();

    message.textContent = result.message;

    loadProducts();

}

// Load products when page opens
loadProducts();

</script>

</body>
</html>
